<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="Add / edit repair job — A to Z Mobile Accessories admin." />
  <title>New Repair Job — A to Z Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../logo.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    textarea { min-height: 84px; resize: vertical; font-family: inherit; }
    .form-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
    .form-actions .form-note { margin: 0; flex: 1; }
  </style>
</head>
<body data-page="repair-form">

  <div class="admin-shell">
    <aside class="admin-side">
      <a class="brand" href="../index.html">
        <img class="brand-logo" src="../logo.png" alt="A to Z Mobile Accessories">
      </a>
      <nav class="admin-nav" aria-label="Admin navigation">
        <a href="index.html" data-nav="dashboard">Dashboard</a>
        <a href="products.html" data-nav="products">Products</a>
        <a href="categories.html" data-nav="categories">Categories</a>
        <a href="inventory.html" data-nav="inventory">Inventory</a>
        <a href="repairs.html" data-nav="repairs" class="active">Repairs</a>
        <a href="approvals.html" data-nav="approvals">Approvals</a>
        <a href="audit-log.html" data-nav="audit">Audit Log</a>
        <a href="admins.html" data-nav="admins">Admins</a>
      </nav>
      <a class="admin-logout" href="login.html">Logout</a>
    </aside>

    <div class="admin-main">
      <div class="admin-topbar">
        <h1 id="rfPageTitle">New Repair Job</h1>
        <div class="admin-user">
          <span class="admin-avatar">…</span>
          <span>Loading…</span>
        </div>
      </div>

      <main class="admin-content">
        <div class="panel">
          <div class="panel-head">
            <h2 id="rfPanelTitle">Create a repair job card</h2>
            <a class="btn btn-outline btn-sm" href="repairs.html">← Back to Repairs</a>
          </div>
          <div class="panel-body">

            <form id="repairForm" class="form-grid">

              <div class="field">
                <label for="rfJob">Job Number</label>
                <input id="rfJob" type="text" disabled placeholder="Auto-generated" autocomplete="off" />
                <p class="form-note" style="margin-top:6px;">Customers use this number to track their repair on the website.</p>
              </div>

              <div class="field">
                <label for="rfStatus">Status</label>
                <select id="rfStatus"></select>
              </div>

              <div class="field">
                <label for="rfCustomer">Customer Name *</label>
                <input id="rfCustomer" type="text" required placeholder="e.g. Rahul Sharma" autocomplete="off" />
              </div>

              <div class="field">
                <label for="rfPhone">Customer Phone *</label>
                <input id="rfPhone" type="tel" required placeholder="e.g. 98XXXXXXXX" autocomplete="off" />
              </div>

              <div class="field">
                <label for="rfDevice">Device *</label>
                <input id="rfDevice" type="text" required placeholder="e.g. Samsung Galaxy A54" autocomplete="off" />
              </div>

              <div class="field">
                <label for="rfModel">Model</label>
                <input id="rfModel" type="text" placeholder="e.g. SM-A546E" autocomplete="off" />
              </div>

              <div class="field">
                <label for="rfSerial">Serial Number</label>
                <input id="rfSerial" type="text" placeholder="IMEI / serial (optional)" autocomplete="off" />
              </div>

              <div class="field">
                <label for="rfEta">Expected Completion</label>
                <input id="rfEta" type="date" />
              </div>

              <div class="field field-full">
                <label for="rfProblem">Problem Reported *</label>
                <textarea id="rfProblem" required placeholder="What the customer says is wrong with the device"></textarea>
              </div>

              <div class="field field-full">
                <label for="rfCondition">Initial Condition (at intake)</label>
                <textarea id="rfCondition" placeholder="Physical condition, scratches, accessories received with device…"></textarea>
              </div>

              <div class="field field-full">
                <label for="rfCurrent">Current Condition (shown to customer) *</label>
                <textarea id="rfCurrent" required placeholder="e.g. Device received and queued for checking"></textarea>
              </div>

              <div class="field field-full">
                <label for="rfAction">Action Being Taken (shown to customer) *</label>
                <textarea id="rfAction" required placeholder="e.g. Initial diagnosis in progress"></textarea>
              </div>

              <div class="field">
                <label for="rfPart">Required Part</label>
                <input id="rfPart" type="text" placeholder="e.g. Charging port connector" autocomplete="off" />
              </div>

              <div class="field">
                <label for="rfPartStatus">Part Status</label>
                <select id="rfPartStatus">
                  <option value="">— Not needed / later —</option>
                  <option>Not Available</option>
                  <option>Ordered</option>
                  <option>Purchased</option>
                  <option>Fitted</option>
                </select>
              </div>

              <div class="field field-full">
                <label for="rfCustomerNote">Customer Note (shown on tracking page)</label>
                <textarea id="rfCustomerNote" placeholder="e.g. We will call you when the device is ready for collection."></textarea>
              </div>

              <div class="field field-full">
                <label for="rfInternalNote">Internal Note (admins only)</label>
                <textarea id="rfInternalNote" placeholder="Anything staff should know — never shown to customers"></textarea>
              </div>

              <div class="field-full form-actions">
                <button class="btn btn-dark" type="submit" id="rfSubmit">Create Repair Job</button>
                <a class="btn btn-outline" href="repairs.html">Cancel</a>
                <p id="rfNote" class="form-note" aria-live="polite"></p>
              </div>

            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script src="../assets/js/repair-form.js"></script>
</body>
</html>
