<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="Admin login — A to Z Mobile Accessories." />
  <title>Admin Login — A to Z Mobile Accessories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../logo.png">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="admin-login">

  <div class="auth-wrap">
    <div class="auth-card">
      <a class="brand" href="../index.html" aria-label="Back to website">
        <img class="brand-logo" src="../logo.png" alt="A to Z Mobile Accessories">
      </a>

      <h1 style="margin:0 0 6px;font-family:'Playfair Display',Georgia,serif;font-size:26px;">Admin Login</h1>
      <p style="margin:0 0 22px;color:var(--muted);font-size:13px;">
        Sign in to manage products, inventory and repairs.
      </p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email / Username</label>
          <input id="email" name="email" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-dark btn-block" type="submit">Sign In</button>
        <p id="loginNote" class="form-note" aria-live="polite"></p>
      </form>

      <p class="form-note" style="margin-top:18px;">
        <a href="../index.html" style="font-weight:700;">← Back to website</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
